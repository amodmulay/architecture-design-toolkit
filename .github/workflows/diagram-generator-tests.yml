name: Diagram generator tests

on:
  push:
    paths:
      - "tools/diagram-generator/**"
      - "tools/install-skills/**"
      - "skills/**"
      - ".claude/skills/**"
      - ".github/skills/**"
      - ".agents/skills/**"
      - "schemas/architecture.schema.json"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/diagram-generator-tests.yml"
  pull_request:
    paths:
      - "tools/diagram-generator/**"
      - "schemas/architecture.schema.json"
      - "examples/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill installer syntax and options
        run: |
          python -m py_compile tools/install-skills/install_skills.py
          python tools/install-skills/install_skills.py --help
      - name: Validate sample model
        run: python tools/diagram-generator/diagramgen.py examples/connected-vehicle-data-platform.json --validate-only
      - name: Generate editable Draw.io file
        run: python tools/diagram-generator/diagramgen.py examples/connected-vehicle-data-platform.json --out /tmp/connected-vehicle-data-platform.drawio --layout-report
      - name: Run unit tests
        run: python -m unittest discover -s tools/diagram-generator -p 'test_*.py' -v
