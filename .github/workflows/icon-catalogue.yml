name: Icon catalogue checks

on:
  push:
    paths:
      - "tools/icon-catalogue/**"
      - "icon-library/**"
      - ".github/workflows/icon-catalogue.yml"
  pull_request:
    paths:
      - "tools/icon-catalogue/**"
      - "icon-library/**"
      - ".github/workflows/icon-catalogue.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tools/icon-catalogue -p "test_*.py" -v
      - name: Audit icon catalogue
        run: python tools/icon-catalogue/iconctl.py audit
